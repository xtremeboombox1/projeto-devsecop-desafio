name: 🔐 Pipeline DevSecOps

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Build, segurança e assinatura do artefato
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build, Segurança e Assinatura
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # ⚠️ Assim que remover segredos do código, passar pra cá
      # Obs: não é uma alternativa tão robusta quanto um Vault por exemplo, mas já que o segredo estava em código....
      # Dicas para cada variável:
      #   - adicione um env 
      #   - crie um segredo correspondente no github
      #   - insira uma referência para encontrá-la no código (exemplo CHAVE = "__CHAVE__")
      #   - injete a variável na referência, usando um sed 
      - name: 🔐 Inserir Secrets no JavaScript
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "api key=$API_KEY" >> "$GITHUB_ENV"
          echo "db_passord=$DB_PASSWORD" >> "$GITHUB_ENV"
      #   sed -i "s|__VAR__|$VAR|g" src/script.js

      - name: ⚙️ Build
        run: |
          echo "Verificando arquivos..."
          ls src/
          echo "Build OK!"

      # Dica: use a action oficial "gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2" e passe o
      - name: 🔑 Secrets Scanning
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ❌ PASSO A IMPLEMENTAR — SAST com Semgrep
      # Dica: instale com "pip install semgrep" e rode
      #   semgrep scan --config auto --config p/xss --error src/
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
        
      - name: SAST - Semgrep
        run: |
          pip install semgrep
          semgrep scan --config auto --config p/xss --error src/

      # ❌ PASSO A IMPLEMENTAR — SCA com Grype
      # Dica: primeiro, gere o package-lock pelo npm:
      #   npm install --package-lock-only --no-audit --no-fund
      # Depois instale o Grype:
      #   curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      # E rode:
      #   grype dir:. --fail-on medium
      - name: 📦 SCA - Grype
        run: echo "TODO - implemente o SCA com Grype aqui"

      # ── Empacota o site em um artefato tar (formato que o Pages consome)
      - name: 📦 Empacotar artefato do site
        run: |
          tar \
            --dereference --hard-dereference \
            -C src \
            -cvf artifact.tar \
            --exclude=.git --exclude=.github \
            .

      # ── Calcula o hash do artefato
      - name: 🔢 Hash do artefato
        run: |
          digest=$(sha256sum artifact.tar | awk '{print $1}')
          echo "$digest" > artifact.tar.sha256
          echo "SHA256: $digest"

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # ❌ PASSO A IMPLEMENTAR — Assinatura via Cosign
      # Este passo NÃO assina de verdade — ele gera um bundle falso, só para
      # demonstração.
      #
      # Dica da assinatura real:
      #   cosign sign-blob artifact.tar --bundle artifact.sigstore.json --yes
      - name: ✍️ Assinar artefato
        run: |
          echo '{ "mock": "assinatura-invalida-para-demonstracao" }' > artifact.sigstore.json
          echo "Assinatura MOCK gerada."

      # ── Publica o artefato + bundle de assinatura para o próximo job
      - name: ⬆️ Upload do artefato assinado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-assinado
          path: |
            artifact.tar
            artifact.sigstore.json
            artifact.tar.sha256
          retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Verifica a assinatura e só então faz o deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Verificação e Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Baixar o artefato assinado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-assinado

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # ⚠️ Usa o Cosign para validar assinatura do artefato - descomentar após assinatura
      # - name: 🔎 Verificar assinatura do artefato
      #  run: |
      #    cosign verify-blob artifact.tar \
      #      --bundle artifact.sigstore.json \
      #      --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*" \
      #      --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      #    echo "Assinatura válida — artefato íntegro e autêntico."

      # Descompacta o site para publicar
      - name: 📂 Extrair site verificado
        run: |
          mkdir -p site
          tar -xvf artifact.tar -C site

      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: 📤 Upload para Produção
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./site

      # Realiza o deploy
      - name: 🚀 Deploy em Produção
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4